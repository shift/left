name: "🐛 Broken Link or Bug"
description: "Report a broken link, typo, or game bug"
labels: ["bug"]
title: "Bug:"
body:
  - type: input
    id: location
    attributes:
      label: Where did you find the bug?
      description: "Link to the room or file"
      placeholder: "https://github.com/shift/left/blob/main/login-bug/README.md"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      placeholder: "The link to 'sprint-review' returns 404"
    validations:
      required: true

  - type: checkboxes
    id: spoiler
    attributes:
      label: "Contains spoilers?"
      options:
        - label: "This report contains spoilers about game content"
          required: false
